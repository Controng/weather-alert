name: Pudong Weather Alert

on:
  schedule:
    # 每小时运行一次，用于保存本周出现过的预警。
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "发送测试邮件（即使没有预警也发送）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check alerts and optionally send report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: june.shao@disney.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_test_email }}" = "true" ]; then
            python weather_monitor.py --test
          else
            python weather_monitor.py
          fi

      - name: Save alert history
        run: |
          if git diff --quiet -- data/alerts.json; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json
          git commit -m "Update Pudong weather alert history"
          git push
